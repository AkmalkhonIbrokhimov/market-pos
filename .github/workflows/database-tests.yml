name: Database tests

on:
  pull_request:
    branches:
      - dev
    paths:
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    name: Migrations, pgTAP, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations
        run: supabase db reset --local

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Lint database schema
        run: supabase db lint --local --fail-on error

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
